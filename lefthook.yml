pre-commit:
  parallel: false
  commands:
    typecheck:
      run: npm run typecheck
    lint:
      run: npm run lint
    secret-scan:
      run: |
        if git diff --cached --name-only | grep -v "^lefthook.yml$" | xargs grep -l "sk-or-v1-\|sk-ant-\|sk-proj-\|AKIA" 2>/dev/null; then
          echo "❌ Possible secret detected in staged files. Aborting."
          exit 1
        fi

pre-push:
  parallel: false
  commands:
    tests:
      run: npm run test:coverage
    build:
      run: npm run build
